name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libtool libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install cython==0.29.33
          pip install https://github.com/kivy/buildozer/archive/master.zip

      - name: Init SDK
        run: |
          buildozer android debug || true
          ls ~/.buildozer/android/platform/android-sdk/

      - name: Accept all licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a56385" >> $SDK/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3b88c" >> $SDK/licenses/android-sdk-license
          echo "y" > $SDK/licenses/android-sdk-preview-license
          find $SDK -name sdkmanager -type f
          SDKMGR=$(find $SDK -name sdkmanager -type f | head -1)
          yes | $SDKMGR --licenses || true
          $SDKMGR --install "build-tools;33.0.2" "build-tools;37.0.0" || true

      - name: Build final APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guapo-apk
          path: bin/*.apk
